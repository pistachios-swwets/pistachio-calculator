<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة تكلفة المنتج — Pistachio Sweets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    @keyframes cc-toast { from { opacity: 0; } to { opacity: 1; } }
    body { font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif; background: #f7f5f0; }
    /* Touch-friendly minimum hit targets */
    button, .cc-touch { min-height: 44px; }
    input, select { min-height: 44px; }
    /* Horizontal scroll safety for tables on small screens */
    .cc-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .cc-table-wrap table { min-width: 340px; }

    @media (max-width: 600px) {
      /* Stack all grids to a single column */
      .cc-grid { grid-template-columns: 1fr !important; }
      .cc-wrap { padding: 12px 10px 48px !important; }
      .cc-head h1 { font-size: 20px !important; }
      .cc-card { padding: 12px !important; }
      .cc-tab { padding: 9px 12px !important; font-size: 12px !important; }
      /* Keep tiny inline number inputs compact (qty boxes) */
      .cc-qtybox { min-height: 34px !important; }
      /* Results price */
      .cc-sell { font-size: 16px !important; }
    }

    /* Login screen */
    .cc-login-bg {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f7f5f0 0%, #e8f0e2 100%); padding: 20px;
    }
    .cc-login-card {
      width: 100%; max-width: 360px; background: #fff; border-radius: 14px;
      border: 1px solid #e2e0db; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 32px 26px; text-align: center;
    }
    .cc-login-card h1 { font-size: 22px; font-weight: 700; color: #4a7c2f; margin: 0 0 4px; }
    .cc-login-sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .cc-login-input {
      width: 100%; padding: 12px 14px; border: 1px solid #e2e0db; border-radius: 10px;
      font-size: 15px; text-align: center; direction: rtl; margin-bottom: 12px;
      font-family: inherit; min-height: 48px;
    }
    .cc-login-input:focus { outline: none; border-color: #4a7c2f; box-shadow: 0 0 0 3px rgba(74,124,47,0.12); }
    .cc-login-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px; background: #4a7c2f;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 48px;
      font-family: inherit; transition: background 0.15s;
    }
    .cc-login-btn:hover { background: #3a6324; }
    .cc-login-err { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // ─── Persistent storage: localStorage → in-memory fallback ───
    const memStore = {};
    const hasLocalStorage = (() => {
      try { const k = "__cc_test__"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    })();

    async function load(key, fallback) {
      try {
        if (hasLocalStorage) {
          const v = window.localStorage.getItem(key);
          return v ? JSON.parse(v) : fallback;
        }
        return (key in memStore) ? JSON.parse(memStore[key]) : fallback;
      } catch (e) { return fallback; }
    }
    async function save(key, data) {
      const val = JSON.stringify(data);
      try {
        if (hasLocalStorage) { window.localStorage.setItem(key, val); return; }
        memStore[key] = val;
      } catch (e) { memStore[key] = val; }
    }

    // ─── Formatting helpers ───
    const fmt = (n) => { const v = parseFloat(n); return isNaN(v) ? "0.000" : v.toFixed(3); };
    const fmtPct = (n) => { const v = parseFloat(n); return isNaN(v) ? "0%" : v.toFixed(1) + "%"; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const INIT_MATERIALS = [
      { id: "m1", name: "حليب طازج", unit: "لتر", costPerUnit: 0.45 },
      { id: "m2", name: "حبوب الكفير", unit: "غرام", costPerUnit: 0.015 },
      { id: "m3", name: "سكر", unit: "غرام", costPerUnit: 0.001 },
      { id: "m4", name: "فانيلا", unit: "مل", costPerUnit: 0.008 },
    ];
    const INIT_PACKAGING = [
      { id: "p1", name: "عبوة 200 مل", cost: 0.025 },
      { id: "p2", name: "عبوة 250 مل", cost: 0.03 },
      { id: "p3", name: "عبوة 500 مل", cost: 0.04 },
      { id: "p4", name: "عبوة 1 لتر", cost: 0.06 },
      { id: "p5", name: "ملصق", cost: 0.01 },
    ];

    const C = {
      bg: "#f7f5f0", card: "#ffffff", pri: "#4a7c2f", priDk: "#3a6324", priLt: "#e8f0e2",
      acc: "#c4842d", accLt: "#fdf4e7", txt: "#2c2c2a", muted: "#6b7280",
      brd: "#e2e0db", danger: "#dc2626",
    };

    // ─── Login screen ───
    const PASSWORD = "atyat";
    const AUTH_KEY = "costcalc_auth";

    function Login({ onSuccess }) {
      const [pw, setPw] = useState("");
      const [err, setErr] = useState("");

      const submit = (e) => {
        if (e) e.preventDefault();
        if (pw === PASSWORD) {
          try { window.sessionStorage.setItem(AUTH_KEY, "true"); } catch (x) {}
          onSuccess();
        } else {
          setErr("كلمة المرور غير صحيحة");
        }
      };

      return (
        <div className="cc-login-bg">
          <form className="cc-login-card" onSubmit={submit}>
            <h1>حاسبة تكلفة المنتج</h1>
            <div className="cc-login-sub">Pistachio Sweets</div>
            <input
              className="cc-login-input"
              type="password"
              placeholder="كلمة المرور"
              value={pw}
              autoFocus
              onChange={(e) => { setPw(e.target.value); if (err) setErr(""); }}
            />
            <button className="cc-login-btn" type="submit">دخول</button>
            <div className="cc-login-err">{err}</div>
          </form>
        </div>
      );
    }

    // ─── Calculator app ───
    function App() {
      const [tab, setTab] = useState("calc");
      const [materials, setMaterials] = useState(null);
      const [packaging, setPackaging] = useState(null);
      const [recipes, setRecipes] = useState(null);
      const [ready, setReady] = useState(false);

      // Calculator state
      const [recipeName, setRecipeName] = useState("");
      const [ingredients, setIngredients] = useState([]);
      const [selPkg, setSelPkg] = useState([]);
      const [profitPct, setProfitPct] = useState(30);
      const [laborCost, setLaborCost] = useState(0);
      const [units, setUnits] = useState(1);

      // Add material form
      const [matName, setMatName] = useState("");
      const [matUnit, setMatUnit] = useState("");
      const [matCost, setMatCost] = useState("");

      // Add packaging form
      const [pkgName, setPkgName] = useState("");
      const [pkgCost, setPkgCost] = useState("");

      // Delete confirmation modal: { type: 'material'|'packaging'|'recipe'|'sale', id, name, password, error }
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      // Mini POS + reports
      const [sales, setSales] = useState(null);
      const [toast, setToast] = useState("");
      const [posRecipeId, setPosRecipeId] = useState("");
      const [posQty, setPosQty] = useState(1);
      const [posPay, setPosPay] = useState("cash");
      const [posCustomer, setPosCustomer] = useState("");
      const [repRange, setRepRange] = useState("today");
      const [repFrom, setRepFrom] = useState("");
      const [repTo, setRepTo] = useState("");

      useEffect(() => {
        (async () => {
          const m = await load("costcalc_materials", INIT_MATERIALS);
          const p = await load("costcalc_packaging", INIT_PACKAGING);
          const r = await load("costcalc_recipes", []);
          const sl = await load("costcalc_sales", []);
          setMaterials(m); setPackaging(p); setRecipes(r); setSales(sl); setReady(true);
        })();
      }, []);

      useEffect(() => { if (ready && materials) save("costcalc_materials", materials); }, [materials, ready]);
      useEffect(() => { if (ready && packaging) save("costcalc_packaging", packaging); }, [packaging, ready]);
      useEffect(() => { if (ready && recipes) save("costcalc_recipes", recipes); }, [recipes, ready]);
      useEffect(() => { if (ready && sales) save("costcalc_sales", sales); }, [sales, ready]);

      if (!ready || !materials || !packaging || !recipes || !sales) {
        return <div style={{ fontFamily: "system-ui", padding: 40, textAlign: "center", color: C.muted, direction: "rtl" }}>جاري التحميل...</div>;
      }

      // ─── Calculations ───
      const matTotal = ingredients.reduce((s, ing) => {
        const m = materials.find(x => x.id === ing.mid);
        return s + (m ? m.costPerUnit * (parseFloat(ing.qty) || 0) : 0);
      }, 0);
      const pkgTotal = selPkg.reduce((s, sp) => {
        const p = packaging.find(x => x.id === sp.id);
        return s + (p ? p.cost * (parseFloat(sp.qty) || 0) : 0);
      }, 0);
      const labor = parseFloat(laborCost) || 0;
      const totalCost = matTotal + pkgTotal + labor;
      const u = Math.max(1, parseFloat(units) || 1);
      const costPerUnit = totalCost / u;
      const pPct = parseFloat(profitPct) || 0;
      const profitAmt = costPerUnit * (pPct / 100);
      const sellPrice = costPerUnit + profitAmt;

      // ─── Actions ───
      const addMaterial = () => {
        if (!matName.trim()) return;
        setMaterials(prev => [...prev, { id: uid(), name: matName.trim(), unit: matUnit.trim() || "وحدة", costPerUnit: parseFloat(matCost) || 0 }]);
        setMatName(""); setMatUnit(""); setMatCost("");
      };
      const addPkg = () => {
        if (!pkgName.trim()) return;
        setPackaging(prev => [...prev, { id: uid(), name: pkgName.trim(), cost: parseFloat(pkgCost) || 0 }]);
        setPkgName(""); setPkgCost("");
      };
      const addIngredient = () => {
        if (materials.length === 0) return;
        setIngredients(prev => [...prev, { mid: materials[0].id, qty: 0 }]);
      };
      const togglePkg = (pid) => {
        setSelPkg(prev => prev.find(x => x.id === pid) ? prev.filter(x => x.id !== pid) : [...prev, { id: pid, qty: 1 }]);
      };
      const saveRecipe = () => {
        if (!recipeName.trim()) return;
        const r = {
          id: uid(), name: recipeName.trim(), ingredients: [...ingredients], packaging: [...selPkg],
          profitPct: pPct, laborCost: labor, units: u,
          savedAt: new Date().toLocaleDateString("ar-BH"),
          totalCost, costPerUnit, sellPrice,
        };
        setRecipes(prev => [...prev, r]);
      };
      const loadRecipe = (r) => {
        setRecipeName(r.name); setIngredients(r.ingredients || []); setSelPkg(r.packaging || []);
        setProfitPct(r.profitPct || 30); setLaborCost(r.laborCost || 0); setUnits(r.units || 1);
        setTab("calc");
      };

      // ─── PDF export (print-based, Option D — full Arabic/RTL, no library) ───
      const exportRecipePDF = (r) => {
        const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        // Recompute the breakdown from the saved inputs using the current materials/packaging.
        const ings = (r.ingredients || []).map(ing => {
          const m = materials.find(x => x.id === ing.mid);
          const qty = parseFloat(ing.qty) || 0;
          return { name: m ? m.name : "—", unit: m ? m.unit : "—", qty, cost: m ? m.costPerUnit * qty : 0 };
        });
        const pkgs = (r.packaging || []).map(sp => {
          const p = packaging.find(x => x.id === sp.id);
          const qty = parseFloat(sp.qty) || 0;
          return { name: p ? p.name : "—", qty, cost: p ? p.cost * qty : 0 };
        });
        const matT = ings.reduce((s, x) => s + x.cost, 0);
        const pkgT = pkgs.reduce((s, x) => s + x.cost, 0);
        const lab = parseFloat(r.laborCost) || 0;
        const tot = matT + pkgT + lab;
        const un = Math.max(1, parseFloat(r.units) || 1);
        const cpu = tot / un;
        const pct = parseFloat(r.profitPct) || 0;
        const prof = cpu * (pct / 100);
        const sell = cpu + prof;
        const exportedOn = new Date().toLocaleDateString("ar-BH");

        const ingRows = ings.length
          ? ings.map(x => `<tr><td>${esc(x.name)}</td><td class="c">${fmt(x.qty)}</td><td class="c">${esc(x.unit)}</td><td class="c">${fmt(x.cost)} BD</td></tr>`).join("")
          : `<tr><td colspan="4" class="c muted">لا توجد مكونات</td></tr>`;
        const pkgRows = pkgs.length
          ? pkgs.map(x => `<tr><td>${esc(x.name)}</td><td class="c">${fmt(x.qty)}</td><td class="c">${fmt(x.cost)} BD</td></tr>`).join("")
          : `<tr><td colspan="3" class="c muted">لا يوجد تغليف</td></tr>`;

        const html =
          '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">' +
          '<title>' + esc(r.name) + ' — Pistachio Sweets</title>' +
          '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">' +
          '<style>' +
          '@page { size: A4; margin: 14mm; }' +
          '* { box-sizing: border-box; }' +
          "body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; direction: rtl; color: #2c2c2a; margin: 0; padding: 24px; }" +
          '.brand { background: #4a7c2f; color: #fff; text-align: center; padding: 16px; border-radius: 10px; }' +
          '.brand h1 { margin: 0; font-size: 20px; }' +
          '.brand div { font-size: 12px; opacity: .9; margin-top: 4px; }' +
          '.rname { font-size: 26px; font-weight: 700; color: #4a7c2f; margin: 18px 0 2px; }' +
          '.rdate { font-size: 12px; color: #6b7280; margin-bottom: 18px; }' +
          '.sec { font-size: 15px; font-weight: 700; color: #4a7c2f; border-bottom: 2px solid #e8f0e2; padding-bottom: 4px; margin: 18px 0 8px; }' +
          'table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }' +
          'th, td { border: 1px solid #d7d7d2; padding: 7px 10px; text-align: right; }' +
          'th { background: #e8f0e2; color: #2c2c2a; font-weight: 600; }' +
          'td.c { text-align: center; }' +
          '.muted { color: #6b7280; }' +
          '.bd { width: 60%; margin-inline-start: auto; }' +
          '.bd td { border: none; border-bottom: 1px solid #eee; padding: 6px 4px; }' +
          '.bd td:last-child { text-align: left; font-weight: 600; }' +
          '.bd tr.total td { border-top: 2px solid #c4842d; color: #c4842d; font-weight: 700; }' +
          '.bd tr.sell td { font-size: 18px; color: #4a7c2f; font-weight: 700; border-bottom: none; padding-top: 10px; }' +
          '.foot { margin-top: 28px; border-top: 1px solid #e2e0db; padding-top: 10px; font-size: 11px; color: #6b7280; display: flex; justify-content: space-between; }' +
          '@media print { body { padding: 0; } }' +
          '</style></head><body>' +
          '<div class="brand"><h1>حاسبة تكلفة المنتج</h1><div>Pistachio Sweets — Product Cost Calculator</div></div>' +
          '<div class="rname">' + esc(r.name) + '</div>' +
          '<div class="rdate">تاريخ الحفظ: ' + esc(r.savedAt || "—") + '</div>' +
          '<div class="sec">المكونات</div>' +
          '<table><thead><tr><th>المادة</th><th class="c">الكمية</th><th class="c">الوحدة</th><th class="c">التكلفة</th></tr></thead><tbody>' + ingRows + '</tbody></table>' +
          '<div class="sec">التغليف</div>' +
          '<table><thead><tr><th>التغليف</th><th class="c">الكمية</th><th class="c">التكلفة</th></tr></thead><tbody>' + pkgRows + '</tbody></table>' +
          '<div class="sec">ملخص التكلفة</div>' +
          '<table class="bd"><tbody>' +
          '<tr><td>تكلفة المواد الخام</td><td>' + fmt(matT) + ' BD</td></tr>' +
          '<tr><td>تكلفة التغليف</td><td>' + fmt(pkgT) + ' BD</td></tr>' +
          '<tr><td>تكلفة العمالة</td><td>' + fmt(lab) + ' BD</td></tr>' +
          '<tr class="total"><td>إجمالي التكلفة</td><td>' + fmt(tot) + ' BD</td></tr>' +
          '<tr><td>عدد الوحدات</td><td>' + un + '</td></tr>' +
          '<tr><td>تكلفة الوحدة</td><td>' + fmt(cpu) + ' BD</td></tr>' +
          '<tr><td>نسبة الربح</td><td>' + fmtPct(pct) + '</td></tr>' +
          '<tr><td>الربح</td><td>' + fmt(prof) + ' BD</td></tr>' +
          '<tr class="sell"><td>سعر البيع</td><td>' + fmt(sell) + ' BD</td></tr>' +
          '</tbody></table>' +
          '<div class="foot"><span>Pistachio Sweets</span><span>تاريخ التصدير: ' + esc(exportedOn) + '</span></div>' +
          '</body></html>';

        const w = window.open("", "_blank");
        if (!w) { return; }
        w.document.open();
        w.document.write(html);
        w.document.close();
        w.focus();
        // Give the font/layout a moment, then open the print dialog (Save as PDF).
        w.onafterprint = () => { try { w.close(); } catch (e) {} };
        setTimeout(() => { try { w.print(); } catch (e) {} }, 400);
      };

      const logout = () => {
        try { window.sessionStorage.removeItem(AUTH_KEY); } catch (x) {}
        window.location.reload();
      };

      // ─── Password-gated deletes (materials, packaging, recipes) ───
      const requestDelete = (type, id, name) => setDeleteConfirm({ type, id, name: name || "", password: "", error: "" });
      const confirmDelete = () => {
        if (!deleteConfirm) return;
        if (deleteConfirm.password !== PASSWORD) {
          setDeleteConfirm(dc => ({ ...dc, error: "كلمة المرور غير صحيحة" }));
          return;
        }
        const { type, id } = deleteConfirm;
        if (type === "material") setMaterials(p => p.filter(x => x.id !== id));
        else if (type === "packaging") setPackaging(p => p.filter(x => x.id !== id));
        else if (type === "recipe") setRecipes(p => p.filter(x => x.id !== id));
        else if (type === "sale") setSales(p => p.filter(x => x.id !== id));
        setDeleteConfirm(null);
      };

      // ─── Mini POS + reports ───
      const PAY = {
        cash: { label: "💵 نقد", short: "💵 نقد", color: "#4a7c2f" },
        bank: { label: "🏦 تحويل بنكي", short: "🏦 تحويل", color: "#2563eb" },
        benefitpay: { label: "📱 BenefitPay", short: "📱 BenefitPay", color: "#7c3aed" },
      };
      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 3000); };
      const localDay = (d) => { const x = d ? new Date(d) : new Date(); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
      const dayOffset = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return localDay(x); };
      const fmtDateTime = (iso) => { try { return new Date(iso).toLocaleString("ar-BH", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return String(iso); } };

      const recordSale = () => {
        const rec = recipes.find(r => r.id === posRecipeId);
        if (!rec) { showToast("اختر وصفة أولاً"); return; }
        const q = Math.max(1, parseFloat(posQty) || 1);
        const unitPrice = parseFloat(rec.sellPrice) || 0;
        const cpu = parseFloat(rec.costPerUnit) || 0;
        const sale = {
          id: uid(), recipeId: rec.id, recipeName: rec.name,
          quantity: q, unitPrice, totalPrice: unitPrice * q,
          costPerUnit: cpu, totalCost: cpu * q, profit: (unitPrice - cpu) * q,
          paymentMethod: posPay, customerName: (posCustomer || "").trim(),
          date: new Date().toISOString(),
        };
        setSales(prev => [sale, ...prev]);
        setPosQty(1); setPosCustomer("");
        showToast("تم تسجيل البيع ✅");
      };

      const exportSalesPDF = (list, periodLabel) => {
        const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const tSales = list.reduce((s, x) => s + (x.totalPrice || 0), 0);
        const tProfit = list.reduce((s, x) => s + (x.profit || 0), 0);
        const margin = tSales > 0 ? tProfit / tSales * 100 : 0;
        const bp = Object.values(list.reduce((acc, x) => { const k = x.recipeId || x.recipeName; if (!acc[k]) acc[k] = { name: x.recipeName, qty: 0, sales: 0, profit: 0 }; acc[k].qty += x.quantity || 0; acc[k].sales += x.totalPrice || 0; acc[k].profit += x.profit || 0; return acc; }, {})).sort((a, b) => b.sales - a.sales);
        const bpRows = bp.length ? bp.map(p => `<tr><td>${esc(p.name)}</td><td class="c">${fmt(p.qty)}</td><td class="c">${fmt(p.sales)} BD</td><td class="c">${fmt(p.profit)} BD</td><td class="c">${fmtPct(p.sales > 0 ? p.profit / p.sales * 100 : 0)}</td></tr>`).join("") : `<tr><td colspan="5" class="c muted">لا مبيعات</td></tr>`;
        const pm = ["cash", "bank", "benefitpay"].map(k => { const r = list.filter(x => x.paymentMethod === k); return { label: PAY[k].short, s: r.reduce((a, x) => a + (x.totalPrice || 0), 0), n: r.length }; });

                    <div style={{ display: "flex", gap: 6, alignItems: "flex-start" }}>
                      <button style={sBtn("ghost")} onClick={() => exportRecipePDF(r)}>📄 PDF</button>
                      <button style={sBtn("ghost")} onClick={() => loadRecipe(r)}>📂 تحميل</button>
                      <button style={sBtn("del")} onClick={() => requestDelete("recipe", r.id, r.name)}>حذف</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* ═══ Mini POS Tab ═══ */}
            {tab === "pos" && (
              <div>
                <div style={sCard} className="cc-card">
                  <div style={{ fontWeight: 700, marginBottom: 12, color: C.pri }}>تسجيل بيع</div>
                  {recipes.length === 0 ? (
                    <div style={{ textAlign: "center", padding: 16, color: C.muted, fontSize: 13 }}>احفظ وصفة أولاً من تبويب الحاسبة</div>
                  ) : (
                    <div>
                      <div style={sGrid(2)} className="cc-grid">
                        <div>
                          <label style={sLabel}>الوصفة المحفوظة</label>
                          <select style={sInput} value={posRecipeId} onChange={e => setPosRecipeId(e.target.value)}>
                            <option value="">— اختر —</option>
                            {recipes.map(r => <option key={r.id} value={r.id}>{r.name} — {fmt(r.sellPrice)} BD</option>)}
                          </select>
                        </div>
                        <div><label style={sLabel}>الكمية</label><input style={sInput} type="number" min="1" value={posQty} onChange={e => setPosQty(e.target.value)} /></div>
                      </div>
                      <div style={{ marginTop: 12 }}>
                        <label style={sLabel}>طريقة الدفع</label>
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                          {Object.keys(PAY).map(k => {
                            const on = posPay === k;
                            return <button key={k} onClick={() => setPosPay(k)} className="cc-touch" style={{
                              flex: "1 1 100px", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit",
                              fontSize: 13, fontWeight: 600, border: `1.5px solid ${PAY[k].color}`,
                              background: on ? PAY[k].color : "#fff", color: on ? "#fff" : PAY[k].color }}>{PAY[k].label}</button>;
                          })}
                        </div>
                      </div>
                      <div style={{ marginTop: 12 }}>
                        <label style={sLabel}>اسم العميل (اختياري)</label>
                        <input style={sInput} value={posCustomer} onChange={e => setPosCustomer(e.target.value)} placeholder="اختياري" />
                      </div>
                      {posRecipeId && (() => {
                        const r = recipes.find(x => x.id === posRecipeId);
                        const q = Math.max(1, parseFloat(posQty) || 1);
                        return r ? <div style={{ ...sRow, marginTop: 12, borderTop: `1px solid ${C.brd}`, paddingTop: 10 }}>
                          <span>الإجمالي</span><span style={{ fontWeight: 700, color: C.pri, fontSize: 16 }}>{fmt((parseFloat(r.sellPrice) || 0) * q)} BD</span>
                        </div> : null;
                      })()}
                      <div style={{ marginTop: 14 }}>
                        <button onClick={recordSale} disabled={!posRecipeId} style={{ ...sBtn("pri"), width: "100%", padding: 14, fontSize: 15, opacity: posRecipeId ? 1 : 0.5 }}>تسجيل البيع</button>
                      </div>
                    </div>
                  )}
                </div>

                <div style={sCard} className="cc-card">
                  <div style={{ fontWeight: 700, marginBottom: 10 }}>مبيعات اليوم</div>
                  <div style={sGrid(3)} className="cc-grid">
                    <div style={{ background: C.priLt, borderRadius: 10, padding: 12, textAlign: "center" }}>
                      <div style={{ fontSize: 11, color: C.muted }}>إجمالي المبيعات</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: C.pri }}>{fmt(todayTotal)} BD</div>
                    </div>
                    <div style={{ background: C.accLt, borderRadius: 10, padding: 12, textAlign: "center" }}>
                      <div style={{ fontSize: 11, color: C.muted }}>إجمالي الربح</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: C.acc }}>{fmt(todayProfit)} BD</div>
                    </div>
                    <div style={{ background: "#eef2ff", borderRadius: 10, padding: 12, textAlign: "center" }}>
                      <div style={{ fontSize: 11, color: C.muted }}>عدد المبيعات</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#4338ca" }}>{todayList.length}</div>
                    </div>
                  </div>
                  {todayList.length > 0 && (
                    <div style={{ marginTop: 12 }}>
                      <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>آخر المبيعات</div>
                      {todayList.slice(0, 5).map(s => (
                        <div key={s.id} style={sRow}>
                          <span style={{ fontSize: 13 }}>{s.recipeName} × {fmt(s.quantity)}</span>
                          <span style={{ fontSize: 13, fontWeight: 600 }}>{fmt(s.totalPrice)} BD <span style={{ color: C.muted, fontWeight: 400, fontSize: 11 }}>{(PAY[s.paymentMethod] || PAY.cash).short}</span></span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ═══ Reports Tab ═══ */}
            {tab === "rep" && (
              <div>
                <div style={sCard} className="cc-card">
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                    {[["today", "اليوم"], ["week", "هالأسبوع"], ["month", "هالشهر"]].map(([k, l]) => (
                      <button key={k} onClick={() => setRepRange(k)} style={{ ...sBtn(repRange === k ? "pri" : "ghost"), flex: "1 1 80px" }}>{l}</button>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap" }}>
                    <div style={{ flex: "1 1 120px" }}><label style={sLabel}>من</label><input style={sInput} type="date" value={repFrom} onChange={e => setRepFrom(e.target.value)} /></div>
                    <div style={{ flex: "1 1 120px" }}><label style={sLabel}>إلى</label><input style={sInput} type="date" value={repTo} onChange={e => setRepTo(e.target.value)} /></div>
                    <button style={sBtn("acc")} onClick={() => setRepRange("custom")}>تطبيق</button>
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 8 }}>الفترة: {rangeLabel}</div>
                </div>

                <div style={sGrid(3)} className="cc-grid">
                  <div style={{ ...sCard, background: C.priLt, textAlign: "center" }}>
                    <div style={{ fontSize: 12, color: C.muted }}>💰 إجمالي المبيعات</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: C.pri }}>{fmt(repTotal)} BD</div>
                  </div>
                  <div style={{ ...sCard, background: C.accLt, textAlign: "center" }}>
                    <div style={{ fontSize: 12, color: C.muted }}>📈 إجمالي الربح</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: C.acc }}>{fmt(repProfit)} BD</div>
                  </div>
                  <div style={{ ...sCard, background: "#eef2ff", textAlign: "center" }}>
                    <div style={{ fontSize: 12, color: C.muted }}>🧾 عدد المبيعات</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#4338ca" }}>{repSales.length}</div>
                  </div>
                </div>

                <div style={{ ...sCard, display: "flex", justifyContent: "space-between", alignItems: "center" }} className="cc-card">
                  <span style={{ fontWeight: 600 }}>نسبة الربح للفترة</span>
                  <span style={{ fontSize: 18, fontWeight: 700, color: marginColor }}>{fmtPct(repMargin)}</span>
                </div>

                <div style={{ ...sCard, padding: 0 }} className="cc-table-wrap">
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                    <thead><tr style={{ background: C.priLt }}>
                      <th style={{ padding: "9px 12px", textAlign: "right" }}>المنتج</th>
                      <th style={{ padding: "9px 12px", textAlign: "center" }}>الكمية</th>
                      <th style={{ padding: "9px 12px", textAlign: "center" }}>المبيعات</th>
                      <th style={{ padding: "9px 12px", textAlign: "center" }}>الربح</th>
                      <th style={{ padding: "9px 12px", textAlign: "center" }}>نسبة</th>
                    </tr></thead>
                    <tbody>{repByProduct.length === 0 ? (
                      <tr><td colSpan={5} style={{ textAlign: "center", padding: 20, color: C.muted }}>لا مبيعات في الفترة</td></tr>
                    ) : repByProduct.map((p, i) => (
                      <tr key={i} style={{ borderBottom: `1px solid ${C.brd}` }}>
                        <td style={{ padding: "9px 12px" }}>{p.name}</td>
                        <td style={{ padding: "9px 12px", textAlign: "center" }}>{fmt(p.qty)}</td>
                        <td style={{ padding: "9px 12px", textAlign: "center" }}>{fmt(p.sales)} BD</td>
                        <td style={{ padding: "9px 12px", textAlign: "center" }}>{fmt(p.profit)} BD</td>
                        <td style={{ padding: "9px 12px", textAlign: "center" }}>{fmtPct(p.sales > 0 ? p.profit / p.sales * 100 : 0)}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>

                <div style={sGrid(3)} className="cc-grid">
                  {repByPay.map(p => (
                    <div key={p.k} style={{ ...sCard, textAlign: "center", borderTop: `3px solid ${PAY[p.k].color}` }}>
                      <div style={{ fontSize: 12, color: C.muted }}>{PAY[p.k].short}</div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: PAY[p.k].color }}>{fmt(p.s)} BD</div>
                      <div style={{ fontSize: 11, color: C.muted }}>{p.n} عملية</div>
                    </div>
                  ))}
                </div>

                <div style={{ textAlign: "center", margin: "4px 0 12px" }}>
                  <button style={sBtn("acc")} onClick={() => exportSalesPDF(repSales, rangeLabel)}>📄 تصدير PDF</button>
                </div>

                <div style={{ ...sCard, padding: 0 }} className="cc-table-wrap">
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead><tr style={{ background: C.priLt }}>
                      <th style={{ padding: "8px 10px", textAlign: "right" }}>التاريخ</th>
                      <th style={{ padding: "8px 10px", textAlign: "right" }}>المنتج</th>
                      <th style={{ padding: "8px 10px", textAlign: "center" }}>كمية</th>
                      <th style={{ padding: "8px 10px", textAlign: "center" }}>المبلغ</th>
                      <th style={{ padding: "8px 10px", textAlign: "center" }}>الدفع</th>
                      <th style={{ padding: "8px 10px", textAlign: "right" }}>العميل</th>
                      <th style={{ width: 34 }}></th>
                    </tr></thead>
                    <tbody>{repSales.length === 0 ? (
                      <tr><td colSpan={7} style={{ textAlign: "center", padding: 20, color: C.muted }}>لا مبيعات</td></tr>
                    ) : repSales.map(s => (
                      <tr key={s.id} style={{ borderBottom: `1px solid ${C.brd}` }}>
                        <td style={{ padding: "8px 10px", whiteSpace: "nowrap" }}>{fmtDateTime(s.date)}</td>
                        <td style={{ padding: "8px 10px" }}>{s.recipeName}</td>
                        <td style={{ padding: "8px 10px", textAlign: "center" }}>{fmt(s.quantity)}</td>
                        <td style={{ padding: "8px 10px", textAlign: "center" }}>{fmt(s.totalPrice)} BD</td>
                        <td style={{ padding: "8px 10px", textAlign: "center" }}>{(PAY[s.paymentMethod] || PAY.cash).short}</td>
                        <td style={{ padding: "8px 10px" }}>{s.customerName || "—"}</td>
                        <td style={{ textAlign: "center" }}><button style={sDelBtn} onClick={() => requestDelete("sale", s.id, s.recipeName)}>✕</button></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            )}
          </div>

          {/* ═══ Delete confirmation modal (password-gated) ═══ */}
          {deleteConfirm && (
            <div onClick={() => setDeleteConfirm(null)}
              style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex",
                alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20, direction: "rtl" }}>
              <div onClick={e => e.stopPropagation()} className="cc-modal-card"
                style={{ background: "#fff", borderRadius: 14, width: "100%", maxWidth: 360,
                  padding: "26px 24px", boxShadow: "0 10px 40px rgba(0,0,0,0.25)", textAlign: "center" }}>
                <div style={{ fontSize: 19, fontWeight: 700, color: C.danger, marginBottom: 6 }}>تأكيد الحذف</div>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 4 }}>أدخل كلمة المرور لتأكيد الحذف</div>
                {deleteConfirm.name && <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>"{deleteConfirm.name}"</div>}
                <input type="password" autoFocus placeholder="كلمة المرور" value={deleteConfirm.password}
                  onChange={e => setDeleteConfirm(dc => ({ ...dc, password: e.target.value, error: "" }))}
                  onKeyDown={e => { if (e.key === "Enter") confirmDelete(); }}
                  style={{ width: "100%", padding: "12px 14px", border: `1px solid ${C.brd}`, borderRadius: 10,
                    fontSize: 15, textAlign: "center", direction: "rtl", boxSizing: "border-box",
                    fontFamily: "inherit", minHeight: 48, marginBottom: 6 }} />
                <div style={{ color: C.danger, fontSize: 13, minHeight: 18, marginBottom: 10 }}>{deleteConfirm.error}</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={confirmDelete}
                    style={{ flex: 1, padding: 12, border: "none", borderRadius: 10, background: C.danger,
                      color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", minHeight: 48, fontFamily: "inherit" }}>
                    حذف
                  </button>
                  <button onClick={() => setDeleteConfirm(null)}
                    style={{ flex: 1, padding: 12, border: `1px solid ${C.brd}`, borderRadius: 10, background: "#f3f4f6",
                      color: C.txt, fontSize: 14, fontWeight: 600, cursor: "pointer", minHeight: 48, fontFamily: "inherit" }}>
                    إلغاء
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 1100,
              background: C.pri, color: "#fff", padding: "12px 22px", borderRadius: 999, fontSize: 14, fontWeight: 600,
              boxShadow: "0 6px 24px rgba(0,0,0,0.25)", animation: "cc-toast 0.25s ease" }}>{toast}</div>
          )}
        </div>
      );
    }

    // ─── Root: password gate ───
    function Root() {
      const [authed, setAuthed] = useState(() => {
        try { return window.sessionStorage.getItem(AUTH_KEY) === "true"; } catch (e) { return false; }
      });
      if (!authed) return <Login onSuccess={() => setAuthed(true)} />;
      return <App />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
